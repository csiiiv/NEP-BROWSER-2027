name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  browser-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - name: Install & build
        working-directory: browser
        run: |
          npm ci
          npm run build
